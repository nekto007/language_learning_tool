{% if request.args.get('from') == 'daily_plan' %}
<div id="daily-plan-bar" style="display:none;" data-dashboard-url="{{ url_for('words.dashboard') }}">
    <a href="{{ url_for('words.dashboard') }}" class="dp-bar__link">
        <div class="dp-bar__progress">
            <!-- dots filled dynamically -->
        </div>
        <span class="dp-bar__text"></span>
    </a>
    <a id="dp-bar__next" class="dp-bar__btn" href="#">→ Следующий шаг</a>
</div>
<style>
#daily-plan-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: 48px;
    background: linear-gradient(135deg, #5046e5 0%, #7c3aed 100%);
    color: #fff;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 0 16px;
    font-family: "Onest", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    box-shadow: 0 2px 8px rgba(80, 70, 229, 0.3);
}
.dp-bar__link {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #fff;
    text-decoration: none;
    transition: opacity 0.15s;
}
.dp-bar__link:hover {
    opacity: 0.85;
    color: #fff;
    text-decoration: none;
}
.dp-bar__progress {
    display: flex;
    align-items: center;
    gap: 6px;
}
.dp-bar__dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.6);
    background: transparent;
    transition: all 0.3s;
}
.dp-bar__dot--done {
    background: #34d399;
    border-color: #34d399;
}
.dp-bar__dot--current {
    border-color: #fff;
    background: transparent;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.3);
}
.dp-bar__dot--upcoming {
    background: rgba(255,255,255,0.25);
    border-color: rgba(255,255,255,0.25);
}
.dp-bar__text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 300px;
}
.dp-bar__btn {
    display: inline-block;
    background: #fff;
    color: #5046e5;
    text-decoration: none;
    padding: 4px 14px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.8125rem;
    white-space: nowrap;
    transition: transform 0.15s, box-shadow 0.15s;
}
.dp-bar__btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    color: #5046e5;
    text-decoration: none;
}
.dp-bar__btn--done {
    background: #34d399;
    color: #fff;
}
.dp-bar__btn--done:hover {
    color: #fff;
}
#daily-plan-bar.dp-bar--visible ~ .navbar,
#daily-plan-bar.dp-bar--visible ~ nav.navbar {
    margin-top: 48px;
}
@media (max-width: 576px) {
    .dp-bar__text {
        max-width: 140px;
        font-size: 0.75rem;
    }
    .dp-bar__btn {
        padding: 3px 10px;
        font-size: 0.75rem;
    }
}
</style>
<script nonce="{{ csp_nonce }}">
(function() {
    'use strict';

    var bar = document.getElementById('daily-plan-bar');
    if (!bar) return;

    var headers = {};
    var jwtToken = localStorage.getItem('jwt_token');
    if (jwtToken) {
        headers['Authorization'] = 'Bearer ' + jwtToken;
    }

    fetch('/api/daily-plan/next-step', {
        credentials: 'same-origin',
        headers: headers
    })
    .then(function(r) {
        // A 4xx/5xx JSON envelope carries no steps; treat it as an error, not «no plan».
        if (!r.ok) { throw new Error('next-step HTTP ' + r.status); }
        return r.json();
    })
    .then(function(data) {
        var total = data.steps_total || 0;
        var done = data.steps_done || 0;
        if (total === 0) return;

        // Build dots
        var dotsHtml = '';
        for (var i = 0; i < total; i++) {
            var cls = 'dp-bar__dot';
            if (i < done) {
                cls += ' dp-bar__dot--done';
            } else if (i === done && !data.all_done) {
                cls += ' dp-bar__dot--current';
            } else {
                cls += ' dp-bar__dot--upcoming';
            }
            dotsHtml += '<span class="' + cls + '"></span>';
        }
        bar.querySelector('.dp-bar__progress').innerHTML = dotsHtml;

        // Text & button
        var textEl = bar.querySelector('.dp-bar__text');
        var btnEl = document.getElementById('dp-bar__next');

        var dash = '{{ url_for("words.dashboard") }}';
        if (data.all_done) {
            // «Выполнено N из N» — never «Шаг 0 из 1» next to a done badge (DP-115).
            textEl.textContent = '\u0412\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u043e ' + done + ' \u0438\u0437 ' + total;
            btnEl.textContent = '\u2728 \u041f\u043b\u0430\u043d \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d!';
            btnEl.href = dash;
            btnEl.classList.add('dp-bar__btn--done');
        } else if (data.has_next && data.step_scope === 'optional' && data.minimum_done) {
            // Minimum met, next step is a bonus — not «Шаг N+1 из N».
            textEl.textContent = '\u041c\u0438\u043d\u0438\u043c\u0443\u043c \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d \u00b7 \u0431\u043e\u043d\u0443\u0441';
            btnEl.textContent = '\u2192 ' + (data.step_title || '\u0411\u043e\u043d\u0443\u0441\u043d\u043e\u0435 \u0437\u0430\u0434\u0430\u043d\u0438\u0435');
            btnEl.href = data.step_url || dash;
        } else if (data.has_next && data.step_scope === 'optional') {
            // A skipped required step unlocked the bonus section (the plan does
            // that on purpose), but the minimum is NOT met — say so, and still
            // offer the step the plan itself offers. Branching on step_scope
            // alone announced «Минимум выполнен» here (review of cde815f5).
            textEl.textContent = '\u0428\u0430\u0433 ' + done + ' \u0438\u0437 ' + total
                + (data.skipped_remaining ? ' \u00b7 \u043f\u0440\u043e\u043f\u0443\u0449\u0435\u043d\u043e ' + data.skipped_remaining : '');
            btnEl.textContent = '\u2192 ' + (data.step_title || '\u0421\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0448\u0430\u0433');
            btnEl.href = data.step_url || dash;
        } else if (!data.has_next && data.skipped_remaining) {
            // Only skipped steps remain: the day is not closed, offer the way back.
            textEl.textContent = '\u0428\u0430\u0433 ' + done + ' \u0438\u0437 ' + total + ' \u00b7 \u043f\u0440\u043e\u043f\u0443\u0449\u0435\u043d\u043e ' + data.skipped_remaining;
            btnEl.textContent = '\u21a9 \u0412\u0435\u0440\u043d\u0443\u0442\u044c\u0441\u044f \u043a \u043f\u043b\u0430\u043d\u0443';
            btnEl.href = dash;
        } else {
            var currentStep = Math.min(done + 1, total);
            textEl.textContent = '\u0428\u0430\u0433 ' + currentStep + ' \u0438\u0437 ' + total;
            btnEl.textContent = '\u2192 \u0421\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0448\u0430\u0433';
            btnEl.href = data.step_url || dash;
        }

        // Show bar. The 48px offset comes from the `.dp-bar--visible ~ nav.navbar`
        // rule above — adding padding on <body> as well pushed the page down by
        // 96px and left a 48px band of bare background under the bar (UI-013).
        bar.style.display = 'flex';
        bar.classList.add('dp-bar--visible');
    })
    .catch(function(err) {
        console.error('Daily plan bar error:', err);
    });
})();
</script>
{% endif %}
