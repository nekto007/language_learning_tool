{% extends 'base.html' %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth/profile.css') }}?v=1">
{% endblock %}

{% block title %}{{ _('Изменить пароль') }} | LLT English{% endblock %}

{% block content %}

<div class="profile-page">
  <div class="pf-card">
    <h2 class="pf-card__title">{{ _('Изменить пароль') }}</h2>

    <form method="POST" action="{{ url_for('auth.change_password') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="pf-field">
        <label class="pf-field__label" for="current_password">{{ _('Текущий пароль') }}</label>
        <input type="password" class="pf-input" id="current_password"
               name="current_password" autocomplete="current-password" required>
      </div>

      <div class="pf-field">
        <label class="pf-field__label" for="new_password">{{ _('Новый пароль') }}</label>
        <input type="password" class="pf-input" id="new_password"
               name="new_password" autocomplete="new-password" minlength="8" required
               aria-describedby="new_password_hint">
        <small id="new_password_hint" class="pf-field__value">
          {{ _('Минимум 8 символов, буквы и цифры.') }}
        </small>
      </div>

      <div class="pf-field">
        <label class="pf-field__label" for="confirm_password">{{ _('Подтвердите новый пароль') }}</label>
        <input type="password" class="pf-input" id="confirm_password"
               name="confirm_password" autocomplete="new-password" minlength="8" required>
      </div>

      <button type="submit" class="pf-btn">{{ _('Сохранить пароль') }}</button>
      <a href="{{ url_for('auth.profile') }}" class="pf-link">{{ _('Отмена') }}</a>
    </form>
  </div>
</div>
{% endblock %}
